  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: scylla-manager:latest
    container_name: scylla-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SCYLLA_HOSTS=scylla
      - SCYLLA_PORT=9042
      - SCYLLA_DC=datacenter1
      - SCYLLA_USER=${SCYLLA_USER:-cassandra}
      - SCYLLA_PASS=${SCYLLA_PASS:-cassandra}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-long-random-secret}
      - JWT_EXPIRES=${JWT_EXPIRES:-8h}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    ports:
      - "8090:3000"        
    networks:
      - shared-network
    restart: unless-stopped

volumes:
  scylla_data:

networks:
  shared-network:
    external: true
    driver: bridge